  <title>Mediegruppen – Analyse</title>
  <meta name="description" content="Svar på fem korte spørsmål og se hva annonsene deres faktisk leverer.">

  <style>
    :root {
      --bg: #efeeec;
      --ink: #262823;
      --sel-ink: #31332d;   /* valgt/besvart-flate */
      --muted: #656860;
      --place: #9a9c94;
      --txt: #322e2e;
      --green: #30a46c;
      --track: #dedcd6;
      --hairline: #eceae6;
      --border: #d9d9d4;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --fold: cubic-bezier(0.42, 0, 0.58, 1); /* easeInEaseOut som i appen */
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: auto; }
    body {
      background: var(--bg);
      font-family: 'Inter', Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* mobilkolonne — sentrert på desktop, full bredde på mobil */
    .stage {
      max-width: 440px;
      margin: 0 auto;
      padding: 10px 16px 6px;
      min-height: 100dvh;
    }
    #view { transition: opacity .18s ease-out; }
    #view.out { opacity: 0; }

    /* ---------- hero-karusell ---------- */
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      margin: 0 -10px 9px;
      height: 331px;
      scrollbar-width: none;
      cursor: grab;
    }
    .carousel::-webkit-scrollbar { display: none; }
    .carousel.dragging { scroll-snap-type: none; cursor: grabbing; }
    .slide { flex: 0 0 100%; scroll-snap-align: center; }
    .card {
      position: relative; height: 100%; margin: 0 4px;
      border-radius: 16px; overflow: hidden; background: #3f464d;
    }
    .card img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .glass {
      position: absolute; inset: 0;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      background: rgba(11,11,11,0.2);
    }
    .m-mark { position: absolute; top: 15px; left: 14px; width: 28px; height: 20px; object-fit: contain; }
    .hero-content { position: absolute; top: 92px; left: 11px; right: 11px; }
    .hero-line {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 44px; line-height: 44px; letter-spacing: -0.88px;
      font-weight: 500; color: #f9ffed;
      display: flex; align-items: flex-end;
    }
    .hero-sub {
      margin-top: 11px; font-size: 16px; line-height: 19px;
      font-weight: 400; color: #e5edd7; max-width: 351px;
    }
    .slide-dark .card { background: #111212; display: flex; align-items: flex-end; justify-content: center; }
    .slide-dark img.dash {
      width: calc(100% - 32px); border-radius: 10px; margin-bottom: 16px; display: block;
    }

    /* odometer (200 % + resultattall) */
    .odo { display: inline-flex; overflow: hidden; }
    .odo .col { opacity: 0; transition: opacity .44s var(--ease); }
    .odo .col.in { opacity: 1; }
    .odo .strip { display: flex; flex-direction: column; }
    .odo .strip.roll { transition: transform .8s var(--ease); }
    .odo-italic { font-style: italic; font-weight: 600; }

    /* ---------- progressbar ---------- */
    .ptrack {
      position: relative; height: 7px; border-radius: 12px;
      background: var(--track); margin: 0 5px 24px;
    }
    .pthumb {
      position: absolute; top: 1px; height: 5px; border-radius: 12px; background: #242120;
    }

    /* ---------- spørsmål ---------- */
    .qblock { margin-bottom: 28px; transition: opacity .22s var(--fold), filter .22s var(--fold); }
    .qblock.f1 { opacity: .75; filter: blur(3px); pointer-events: none; }
    .qblock.f2 { opacity: .55; filter: blur(5px); pointer-events: none; }
    .qblock.f3 { opacity: .4;  filter: blur(7px); pointer-events: none; }
    .qtitle {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 500; letter-spacing: -0.72px;
      color: var(--ink); margin-bottom: 5px; line-height: 1.25;
    }
    .qicons { display: inline-flex; align-items: center; gap: 6px; }
    .qicons svg { display: block; }

    .opt {
      display: flex; align-items: center; gap: 12px;
      height: 58px; padding: 0 22px; margin-bottom: 8px;
      background: #fff; border-radius: 14px;
      font-size: 16px; font-weight: 500; color: var(--txt);
      cursor: pointer; user-select: none; overflow: hidden;
      transition: height .22s var(--fold), margin .22s var(--fold),
                  border-radius .22s var(--fold), background .15s ease, padding .22s var(--fold);
    }
    .opts .opt:last-child { margin-bottom: 0; }
    .opt .lbl { transition: font-size .22s var(--fold); }
    .opt .ico { display: inline-flex; width: 18px; justify-content: center; }
    .opt .dots { color: var(--muted); font-size: 18px; line-height: 1; margin-top: -2px; }
    .opt .ck { margin-left: auto; opacity: 0; }
    .opt.sel { background: var(--sel-ink); color: #fff; }
    .opt.sel .dots { color: #fff; }
    .opt.sel .ck { opacity: 1; animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes pop { from { transform: scale(.4); } }

    /* hake/kryss tegnet som i appen (kantlinjer) */
    .check {
      width: 12px; height: 7px;
      border-left: 2px solid #fff; border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translateY(-2px); display: inline-block;
    }
    .cross { position: relative; width: 11px; height: 11px; display: inline-block; }
    .cross i { position: absolute; left: 4.75px; top: -0.5px; width: 1.5px; height: 12px; background: var(--muted); }
    .cross i:first-child { transform: rotate(45deg); }
    .cross i:last-child { transform: rotate(-45deg); }

    /* ja/nei */
    .yn { display: flex; gap: 9px; }
    .yn .opt { flex: 1; justify-content: center; padding: 0; gap: 8px; }
    .yn .opt .ck { display: none; }
    .yn .opt .ynic { display: inline-flex; }
    .yn .opt .check { border-color: var(--muted); }
    .yn .opt.sel .check { border-color: #fff; animation: pop .28s cubic-bezier(.3, 1.6, .5, 1); }
    .yn .opt.sel .cross i { background: #fff; }
    .qblock.answered .yn .opt.sel .check { border-color: var(--green); }
    .qblock.answered .yn .opt.sel .cross i { background: var(--green); }

    /* besvart liste: uvalgte folder seg, valgt blir kompakt B2-rad */
    .qblock.answered:not(.editing) .opts .opt:not(.sel) { height: 0; margin-bottom: 0; }
    .qblock.answered:not(.editing) .opts .opt.sel {
      height: 44px; border-radius: 12px; margin-bottom: 0;
    }
    .qblock.answered:not(.editing) .opts .opt.sel .lbl { font-size: 15px; }
    .qblock.answered .opts .opt.sel .ck .check { border-color: var(--green); }

    /* ---------- footer ---------- */
    .foot {
      margin: 36px -10px 0; background: #f7f6f4; border-radius: 14px;
      padding: 32px 26px 30px;
    }
    .foot img { width: 96px; height: 68px; object-fit: contain; display: block; margin-bottom: 36px; }
    .foot p { font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 400; margin-bottom: 12px; }
    .foot p:last-child { margin-bottom: 0; }

    /* ---------- resultat ---------- */
    #result { display: none; }
    .r-label { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
    .r-hook {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 36px; line-height: 36px; letter-spacing: -0.72px;
      font-weight: 500; color: #262323; margin-bottom: 14px;
    }
    .r-card {
      background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 22px;
    }
    .r-card .rl { font-size: 14px; font-weight: 500; color: var(--muted); }
    .r-num { display: flex; align-items: flex-end; margin-top: 4px; font-weight: 500; }
    .r-num .odo { height: 41px; font-size: 34px; line-height: 41px; letter-spacing: -0.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .r-num .unit { font-size: 20px; line-height: 38px; color: var(--muted); margin-left: 2px; }
    .r-div { height: 1px; background: var(--hairline); margin: 16px 0; }
    .r-answers { font-size: 15px; line-height: 24px; color: var(--ink); white-space: pre-line; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      height: 56px; border-radius: 14px; background: var(--ink); color: #fff;
      font-size: 17px; font-weight: 500; cursor: pointer; user-select: none; margin-top: 12px;
      border: none; width: 100%; font-family: inherit;
    }
    .btn:active { opacity: .85; }

    /* skjult switch for iOS-haptikk (Safari 17.4+) */
    #hpt { position: fixed; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  </style>
</head>
<body>
  <input type="checkbox" id="hpt" switch tabindex="-1" aria-hidden="true">

  <div class="stage">
    <div id="view">

      <div id="quiz">
        <div class="carousel" id="carousel">
          <div class="slide">
            <div class="card">
              <img class="bg" id="heroImg" alt="">
              <div class="glass"></div>
              <img class="m-mark" src="images/funnel/logo-top.png" alt="Mediegruppen">
              <div class="hero-content">
                <div class="hero-line"><span id="heroOdo"></span><span>&nbsp;flere</span></div>
                <div class="hero-line">Kunder.</div>
                <div class="hero-line">Samme Budsjett</div>
                <p class="hero-sub">På 90 dager kan du få 200% flere kunder med samme annonsebudsjett.</p>
              </div>
            </div>
          </div>
          <div class="slide slide-dark">
            <div class="card"><img class="dash" src="images/funnel/ads-dashboard.png" alt="Kampanjeresultater fra Meta Annonseadministrator"></div>
          </div>
          <div class="slide slide-dark"><div class="card"></div></div>
        </div>
        <div class="ptrack" id="ptrack"><div class="pthumb" id="pthumb"></div></div>
        <div id="flow"></div>
      </div>

      <div id="result">
        <p class="r-label">Ferdig</p>
        <h1 class="r-hook">Resultatsiden kommer her</h1>
        <div class="r-card">
          <p class="rl">Kostnad per henvendelse</p>
          <div class="r-num"><span id="resOdo"></span><span class="unit">&nbsp;kr</span></div>
          <div class="r-div"></div>
          <div class="r-answers" id="resAnswers"></div>
        </div>
        <button class="btn" id="restart">Start på nytt</button>
      </div>

      <div class="foot">
        <img src="images/funnel/logo-top.png" alt="Mediegruppen">
        <p>© 2026 Mediegruppen. Alle rettigheter reservert &nbsp;•</p>
        <p>Personvern &nbsp;•&nbsp; Vilkår &nbsp;•</p>
        <p>Mediegruppen.no</p>
      </div>

    </div>
  </div>

<script>
  /* ============ konstanter fra appen ============ */
  var INK = '#262823', MUTED = '#656860', GREEN = '#30a46c';
  var DEMO_RESULT = 1250; // demotall — byttes med ekte utregning

  function iconSvg(name, size, color) {
    if (name === 'dots') return '<span class="dots">⋯</span>';
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24"><path d="' + PATHS[name] + '" fill="' + color + '"/></svg>';
  }

  var STEPS = [
    { q: 'Kjører dere betalte annonser?', type: 'yesno', opts: ['Ja', 'Nei'],
      titleIcons: ['meta', 'google', 'snapchat', 'tiktok'] },
    { q: 'Hvor annonserer dere i dag?', opts: ['Meta (Facebook og Instagram)', 'Google', 'Snapchat eller TikTok', 'Flere kanaler'],
      icons: { 'Meta (Facebook og Instagram)': 'meta', 'Google': 'google', 'Snapchat eller TikTok': 'snapchat', 'Flere kanaler': 'dots' } },
    { q: 'Hva bruker dere på annonser i dag?', opts: ['Under 10 000 kr', '10 000 – 30 000 kr', '30 000 – 100 000 kr', 'Over 100 000 kr'] },
    { q: 'Hvor mange henvendelser gir det deg per måned?', opts: ['0 – 5', '5 – 20', '20 – 50', 'Over 50'] },
    { q: 'Hvor mange av dem blir kunder?', opts: ['Nesten ingen', 'Rundt 1 av 10', 'Rundt 1 av 4', 'Halvparten eller mer'] },
  ];

  /* ============ tilfeldig hero-bilde ============ */
  var HEROES = ['images/funnel/hero.jpg', 'images/funnel/hero2.jpg', 'images/funnel/hero3.jpg'];
  document.getElementById('heroImg').src = HEROES[Math.floor(Math.random() * HEROES.length)];

  /* ============ haptikk: Android-vibrasjon + iOS switch-tikk ============ */
  var hpt = document.getElementById('hpt');
  function haptic() {
    if (navigator.vibrate) navigator.vibrate(8);
    // iOS Safari 17.4+: programmatiske klikk på switch gir ikke tikk — derfor er
    // hvert valg en <label for="hpt">, så selve trykket toggler den. Dette er backup.
  }

  /* ============ odometer ============ */
  function odometer(el, value, opts) {
    opts = opts || {};
    var lh = opts.lh, delay = opts.delay || 200, italic = opts.italic;
    var str = value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (opts.suffix || '');
    el.innerHTML = '';
    var odo = document.createElement('span');
    odo.className = 'odo'; odo.style.height = lh + 'px';
    str.split('').forEach(function (ch, idx) {
      var col = document.createElement('span');
      col.className = 'col' + (italic ? ' odo-italic' : '');
      if (!/\d/.test(ch)) {
        col.textContent = ch; col.style.lineHeight = lh + 'px';
        odo.appendChild(col);
        setTimeout(function () { col.classList.add('in'); }, delay + idx * 90);
        return;
      }
      var strip = document.createElement('span');
      strip.className = 'strip'; strip.style.lineHeight = lh + 'px';
      var target = parseInt(ch, 10);
      for (var d = 0; d <= target; d++) {
        var s = document.createElement('span'); s.textContent = d; strip.appendChild(s);
      }
      col.appendChild(strip); odo.appendChild(col);
      setTimeout(function () {
        col.classList.add('in');
        strip.classList.add('roll');
        strip.style.transform = 'translateY(-' + target * lh + 'px)';
      }, delay + idx * 90);
    });
    el.appendChild(odo);
  }
  odometer(document.getElementById('heroOdo'), 200, { suffix: '%', lh: 44, delay: 350, italic: true });

  /* ============ karusell + progress-morf (B) ============ */
  var car = document.getElementById('carousel');
  var ptrack = document.getElementById('ptrack');
  var pthumb = document.getElementById('pthumb');
  function updateThumb() {
    var max = car.scrollWidth - car.clientWidth;
    var p = max > 0 ? Math.min(Math.max(car.scrollLeft / max, 0), 1) * 2 : 0; // 0..2
    var i = Math.min(Math.floor(p), 1), f = p - i;
    var eIn = f * f, eOut = 1 - (1 - f) * (1 - f);
    var tw = ptrack.clientWidth - 2, segW = tw / 3;
    var left = (i + eIn) * segW, right = (i + 1 + eOut) * segW;
    pthumb.style.left = (1 + left) + 'px';
    pthumb.style.width = (right - left) + 'px';
  }
  car.addEventListener('scroll', function () { requestAnimationFrame(updateThumb); });
  window.addEventListener('resize', updateThumb);
  // muse-drag på desktop
  (function () {
    var down = false, sx = 0, ss = 0;
    car.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'touch') return;
      down = true; sx = e.clientX; ss = car.scrollLeft;
      car.classList.add('dragging'); car.setPointerCapture(e.pointerId);
    });
    car.addEventListener('pointermove', function (e) {
      if (down) car.scrollLeft = ss - (e.clientX - sx);
    });
    function up() {
      if (!down) return;
      down = false; car.classList.remove('dragging');
      var w = car.clientWidth;
      var t = Math.min(Math.max(Math.round(car.scrollLeft / w), 0), 2);
      car.scrollTo({ left: t * w, behavior: 'smooth' });
    }
    car.addEventListener('pointerup', up);
    car.addEventListener('pointercancel', up);
  })();

  /* ============ scroll-glid med appens easing ============ */
  function bezier(x1, y1, x2, y2) {
    function A(a1, a2) { return 1 - 3 * a2 + 3 * a1; }
    function B(a1, a2) { return 3 * a2 - 6 * a1; }
    function C(a1) { return 3 * a1; }
    function calc(t, a1, a2) { return ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t; }
    function slope(t, a1, a2) { return 3 * A(a1, a2) * t * t + 2 * B(a1, a2) * t + C(a1); }
    return function (x) {
      var t = x;
      for (var i = 0; i < 5; i++) {
        var s = slope(t, x1, x2);
        if (s === 0) break;
        t -= (calc(t, x1, x2) - x) / s;
      }
      return calc(t, y1, y2);
    };
  }
  var easeApp = bezier(0.16, 1, 0.3, 1);
  var glideId = 0;
  function glideTo(targetY, dur) {
    dur = dur || 420;
    var id = ++glideId;
    var startY = window.scrollY;
    var maxY = document.documentElement.scrollHeight - window.innerHeight;
    targetY = Math.max(0, Math.min(targetY, maxY));
    if (Math.abs(targetY - startY) < 8) return;
    var t0 = performance.now();
    (function tick(now) {
      if (id !== glideId) return;
      var t = Math.min((now - t0) / dur, 1);
      window.scrollTo(0, startY + (targetY - startY) * easeApp(t));
      if (t < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  /* ============ bygg spørsmålene ============ */
  var flow = document.getElementById('flow');
  var step = 0, answers = new Array(STEPS.length).fill(null);
  var advanceScheduled = false;
  var blocks = [];

  STEPS.forEach(function (q, i) {
    var b = document.createElement('div');
    b.className = 'qblock';
    var title = '<div class="qtitle"><span>' + q.q + '</span>';
    if (q.titleIcons) {
      title += '<span class="qicons">' + q.titleIcons.map(function (n) {
        return iconSvg(n, 12, '#9a9c94');
      }).join('') + '</span>';
    }
    title += '</div>';
    var inner = title;
    if (q.type === 'yesno') {
      inner += '<div class="yn">' + q.opts.map(function (o) {
        var ic = o === 'Ja'
          ? '<span class="ynic"><span class="check"></span></span>'
          : '<span class="ynic"><span class="cross"><i></i><i></i></span></span>';
        return '<label for="hpt" class="opt" data-opt="' + o + '">' + ic + '<span class="lbl">' + o + '</span></label>';
      }).join('') + '</div>';
    } else {
      inner += '<div class="opts">' + q.opts.map(function (o) {
        var ic = q.icons ? '<span class="ico" data-ico="' + q.icons[o] + '">' + iconSvg(q.icons[o], 18, INK) + '</span>' : '';
        return '<label for="hpt" class="opt" data-opt="' + o + '">' + ic + '<span class="lbl">' + o + '</span>' +
          '<span class="ck"><span class="check"></span></span></label>';
      }).join('') + '</div>';
    }
    b.innerHTML = inner;
    flow.appendChild(b);
    blocks.push(b);
    b.querySelectorAll('.opt').forEach(function (optEl) {
      optEl.addEventListener('click', function () { choose(i, optEl.dataset.opt); });
    });
  });

  function refreshDist() {
    blocks.forEach(function (b, i) {
      b.classList.remove('f1', 'f2', 'f3');
      if (i > step) b.classList.add('f' + Math.min(i - step, 3));
    });
  }
  refreshDist();

  function markSel(i) {
    var q = STEPS[i], b = blocks[i];
    b.querySelectorAll('.opt').forEach(function (o) {
      var sel = o.dataset.opt === answers[i];
      o.classList.toggle('sel', sel);
      var ico = o.querySelector('.ico');
      if (ico) {
        var name = ico.dataset.ico;
        var color = sel ? '#ffffff' : (name === 'dots' ? MUTED : INK);
        ico.innerHTML = iconSvg(name, 18, color);
      }
    });
  }

  function blockTop(i) {
    return blocks[i].getBoundingClientRect().top + window.scrollY;
  }

  function choose(i, opt) {
    haptic();
    answers[i] = opt;
    markSel(i);
    var b = blocks[i];

    if (i === step) {
      if (advanceScheduled) return;
      advanceScheduled = true;
      setTimeout(function () {
        advanceScheduled = false;
        b.classList.add('answered');
        step = i + 1;
        refreshDist();
        if (step < STEPS.length) {
          // sekvensielt: folden først (220ms), så ETT glid
          setTimeout(function () {
            glideTo(blockTop(step) - (step === 1 ? 310 : 150));
          }, 240);
        } else {
          setTimeout(showResult, 500);
        }
      }, 150);
    } else if (b.classList.contains('answered') && STEPS[i].type !== 'yesno') {
      if (!b.classList.contains('editing')) {
        // trykk på kompakt rad: fold ut for redigering (kun valgt rad er trykkbar)
        b.classList.add('editing');
      } else {
        // nytt valg gjort i åpen tilstand: fold sammen igjen, uten å gå videre
        b.classList.remove('editing');
      }
    }
  }

  /* ============ resultat ============ */
  function showResult() {
    var view = document.getElementById('view');
    view.classList.add('out');
    setTimeout(function () {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      window.scrollTo(0, 0);
      document.getElementById('resAnswers').textContent =
        answers.map(function (a, i) { return (i + 1) + '. ' + a; }).join('\n');
      odometer(document.getElementById('resOdo'), DEMO_RESULT, { lh: 41, delay: 300 });
      view.classList.remove('out');
      if (typeof fbq !== 'undefined') fbq('track', 'Lead');
    }, 200);
  }

  document.getElementById('restart').addEventListener('click', function () {
    var view = document.getElementById('view');
    view.classList.add('out');
    setTimeout(function () {
      answers = new Array(STEPS.length).fill(null);
      step = 0; advanceScheduled = false;
      blocks.forEach(function (b, i) { b.classList.remove('answered', 'editing'); markSel(i); });
      refreshDist();
      document.getElementById('result').style.display = 'none';
      document.getElementById('quiz').style.display = 'block';
      window.scrollTo(0, 0);
      view.classList.remove('out');
    }, 200);
  });

  window.addEventListener('load', updateThumb);
</script>
</body>
</html>
